# 巡检监控场景配置文件
# 用于配置巡检无人机、工作流和仿真参数

# 场景基本信息
scenario_name: "巡检监控场景"
description: "展示如何使用修正后的框架实现巡检监控场景"

# 引用公共配置
common_config: "common_config.yaml"

# 智能体配置
agents:
  - id: "InspectionDrone_A"
    type: "inspection_drone"
    description: "负责区域巡检的无人机"
    properties:
      battery_level: 100.0
      battery_capacity: 5000.0
      payload_capacity: 2.0
      weight: 2.0
      max_speed: 12.0  # m/s
      communication_range: 1000.0  # 米
      sensor_status:
        camera: 'normal'
        lidar: 'normal'
        gps: 'normal'
    initial_position:
      x: 0.0
      y: 0.0
      z: 50.0
    components:
      - "Energy"
      - "Mobility"
      - "Communication"
      - "Inspection"
      - "Sensing"

  - id: "InspectionDrone_B"
    type: "inspection_drone"
    description: "负责重点区域巡检的无人机"
    properties:
      battery_level: 100.0
      battery_capacity: 5000.0
      payload_capacity: 2.0
      weight: 2.0
      max_speed: 12.0  # m/s
      communication_range: 1000.0  # 米
      sensor_status:
        camera: 'normal'
        lidar: 'normal'
        gps: 'normal'
    initial_position:
      x: 200.0
      y: 200.0
      z: 50.0
    components:
      - "Energy"
      - "Mobility"
      - "Communication"
      - "Inspection"
      - "Sensing"

# 工作流配置
workflows:
  - id: "inspection_workflow_1"
    name: "区域巡检工作流1"
    type: "inspection"
    description: "覆盖主要区域的巡检任务"
    agent_id: "InspectionDrone_A"
    properties:
      inspection_points:
        - x: 50.0
          y: 50.0
          z: 50.0
        - x: 100.0
          y: 50.0
          z: 50.0
        - x: 150.0
          y: 250.0
          z: 50.0
        - x: 150.0
          y: 100.0
          z: 50.0
        - x: 100.0
          y: 100.0
          z: 50.0
        - x: 50.0
          y: 100.0
          z: 50.0
      inspection_mode: "sequential"
      data_collection_type: "image"
      inspection_altitude: 50.0
      required_data_size: 100  # MB
      detection_accuracy_threshold: 0.8
      timeout: 2400  # 40分钟
    start_delay: 1  # 立即启动

  - id: "inspection_workflow_2"
    name: "重点区域巡检工作流2"
    type: "inspection"
    description: "重点区域的详细巡检任务"
    agent_id: "InspectionDrone_B"
    properties:
      inspection_points:
        - x: 300.0
          y: 300.0
          z: 60.0
        - x: 350.0
          y: 300.0
          z: 60.0
        - x: 400.0
          y: 300.0
          z: 60.0
        - x: 400.0
          y: 350.0
          z: 60.0
        - x: 350.0
          y: 350.0
          z: 60.0
        - x: 300.0
          y: 350.0
          z: 60.0
        - x: 300.0
          y: 400.0
          z: 60.0
        - x: 350.0
          y: 400.0
          z: 60.0
      inspection_mode: "adaptive"
      data_collection_type: "video"
      inspection_altitude: 60.0
      detection_accuracy_threshold: 0.8
      required_data_size: 100  # MB
      timeout: 3000  # 50分钟
    start_delay: 300  # 5分钟后启动

# 事件监控配置
event_monitoring:
  enable: true
  events:
    - "task_completed"
    - "workflow_status_changed"
    - "agent_status_changed"
    - "inspection_started"
    - "inspection_ended"
    - "battery_low"
    - "inspection_completed"
    - "object_detected"
    - "data_collected"

# 输出配置
output:
  enable_statistics: true
  save_trajectory: true
  save_energy_consumption: true
  save_communication_logs: true
  save_inspection_data: true
  save_detection_results: true
  report_format: "json"
  detailed_logs: true