# 物流配送场景配置文件
# 用于配置物流无人机、工作流和仿真参数

# 场景基本信息
scenario_name: "物流配送场景"
description: "展示如何使用修正后的框架实现物流配送场景"

# 引用公共配置
common_config: "common_config.yaml"

# 智能体配置
agents:
  - id: "LogisticsDrone_A"
    type: "logistics_drone"
    description: "负责取件和第一段运输的物流无人机"
    properties:
      battery_level: 100.0
      battery_capacity: 5000.0
      payload_capacity: 3.0
      weight: 2.5
      max_speed: 15.0  # m/s
      communication_range: 1000.0  # 米
    initial_position:
      x: 0.0
      y: 0.0
      z: 100.0
    components:
      - "Energy"
      - "Mobility"
      - "Communication"
      - "Logistics"
      - "Sensing"

  - id: "LogisticsDrone_B"
    type: "logistics_drone"
    description: "负责中继运输和交付的物流无人机"
    properties:
      battery_level: 100.0
      battery_capacity: 5000.0
      payload_capacity: 3.0
      weight: 2.5
      max_speed: 15.0  # m/s
      communication_range: 1000.0  # 米
    initial_position:
      x: 300.0
      y: 200.0
      z: 100.0
    components:
      - "Energy"
      - "Mobility"
      - "Communication"
      - "Logistics"
      - "Sensing"

# 工作流配置
workflows:
  - id: "delivery_workflow_1"
    name: "配送工作流1"
    type: "logistics"
    description: "配送工作流2"
    agent_id: "LogisticsDrone_A"
    properties:
      pickup_location:
        x: 50.0
        y: 50.0
        z: 10.0
      delivery_location:
        x: 150.0
        y: 150.0
        z: 10.0
      payload_id: "package_001"
      payload_weight: 1.5
    start_delay: 1  # 立即启动

  - id: "delivery_workflow_2"
    name: "配送工作流2"
    type: "logistics"
    description: "配送工作流2"
    agent_id: "LogisticsDrone_B"
    properties:
      pickup_location:
        x: 100.0
        y: 100.0
        z: 10.0
      delivery_location:
        x: 500.0
        y: 400.0
        z: 10.0
      payload_id: "package_002"
      payload_weight: 2.0
    start_delay: 1  # 立即启动
