# 公共配置文件
# 包含所有场景共享的仿真和环境参数

# 仿真参数
simulation:
  duration: 1800  # 仿真时长（秒）
  time_step: 1.0  # 时间步长（秒）
  visual_interval: 1.0  # 可视化更新间隔
  enable_logging: true
  log_level: "INFO"
  output_dir: "./test_output"

# 环境配置
environment:
  region_name: "北京低空区域"
  bounds:
    min_lat: 39.9
    max_lat: 40.1
    min_lon: 116.3
    max_lon: 116.5
    min_alt: 0.0
    max_alt: 500.0
  weather:
    enable_weather: true
    wind_speed_range: [0, 15]  # m/s
    visibility_range: [1000, 10000]  # 米
    update_interval: 300  # 秒
  obstacles:
    enable_obstacles: true
    detection_range: 1000.0
    collision_buffer: 5.0
  # 通信环境特定配置（用于通信场景）
  communication_environment:
    enable_interference: true
    base_stations:
      - id: "BS_001"
        position: [100.0, 200.0, 50.0]  # x, y, z (米)
        frequency: 2.4  # GHz
        power: 20.0  # dBm
        coverage_radius: 2000.0  # 米
      - id: "BS_002"
        position: [250.0, 300.0, 60.0]  # x, y, z (米)
        frequency: 5.0  # GHz
        power: 25.0  # dBm
        coverage_radius: 1500.0  # 米
    interference_sources:
      - type: "urban_noise"
        power_level: -90.0  # dBm
        frequency_range: [2.4, 2.5]  # GHz
      - type: "industrial"
        power_level: -80.0  # dBm
        frequency_range: [5.0, 5.2]  # GHz

# 坐标系统说明
coordinate_system:
  description: "统一使用虚拟笛卡尔坐标系统"
  system: "Cartesian"
  x_unit: "meters"
  y_unit: "meters"
  z_unit: "meters"
  origin: "坐标原点(0,0,0)位于仿真区域的西南角地面"
  bounds:
    x_range: [0, 1000]  # 东西方向，1000米
    y_range: [0, 1000]  # 南北方向，1000米
    z_range: [0, 500]   # 垂直方向，500米
  note: "所有场景统一使用虚拟坐标，便于规划和控制"

# 事件监控配置（通用）
event_monitoring:
  enable: true
  events:
    - "task_completed"
    - "workflow_status_changed"
    - "agent_status_changed"
    - "battery_low"
    - "communication_established"
    - "communication_lost"
    - "obstacle_detected"
    - "weather_changed"

# 输出配置（通用）
output:
  enable_statistics: true
  save_trajectory: true
  save_energy_consumption: true
  save_communication_logs: true
  report_format: "json"
  detailed_logs: true
