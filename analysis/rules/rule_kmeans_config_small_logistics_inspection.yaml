metadata:
  scenario: small_logistics_inspection
  version: 1
  source: rule_weight_summarizer
  n_features: 26
features:
- name: spatial_variance
  source: S_ctx.geo_var
- name: temporal_density
  source: S_ctx.time_var
- name: task_diversity
  source: S_ctx.task_diversity
- name: n_samples
  source: S_ctx.n_samples
weight_mapping:
  spatial:
  - 0
  - 1
  - 2
  operation_type:
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  - 10
  requirement:
  - 11
  - 12
  - 13
  - 14
  - 15
  resource:
  - 16
  - 17
  - 18
  - 19
  - 20
  qos:
  - 21
  - 22
  - 23
  - 24
  - 25
feature_names:
- location_x
- location_y
- location_z
- op_pickup
- op_transport
- op_delivery
- op_inspection
- op_compute
- op_communication
- op_completion
- op_empty
- req_mobility
- req_logistics
- req_inspection
- req_communication
- req_compute
- payload_weight
- compute_gflops
- cpu_intensity
- memory_intensity
- io_intensity
- comm_bandwidth_mb
- max_latency_s
- quality_threshold
- inspection_interval
- n_inspection_points
rules:
- id: R_logistics_spatial
  priority: 10
  if:
  - feature: spatial_variance
    op: '>'
    value: 0.15
  then:
    weights:
    - 0.9   # location_x
    - 0.9   # location_y
    - 0.8   # location_z
    - 0.95  # op_pickup
    - 0.95  # op_transport
    - 0.9   # op_delivery
    - 0.3   # op_inspection
    - 0.3   # op_compute
    - 0.4   # op_communication
    - 0.3   # op_completion
    - 0.2   # op_empty
    - 0.8   # req_mobility
    - 0.9   # req_logistics
    - 0.3   # req_inspection
    - 0.4   # req_communication
    - 0.3   # req_compute
    - 0.9   # payload_weight
    - 0.3   # compute_gflops
    - 0.3   # cpu_intensity
    - 0.3   # memory_intensity
    - 0.4   # io_intensity
    - 0.4   # comm_bandwidth_mb
    - 0.5   # max_latency_s
    - 0.3   # quality_threshold
    - 0.2   # inspection_interval
    - 0.2   # n_inspection_points
    n_clusters_per_run: 30
  notes: 物流场景：空间分散时，强调位置和运输任务类型
- id: R_logistics_compact
  priority: 8
  if:
  - feature: spatial_variance
    op: <=
    value: 0.15
  then:
    weights:
    - 0.7   # location_x
    - 0.7   # location_y
    - 0.6   # location_z
    - 0.9   # op_pickup
    - 0.9   # op_transport
    - 0.9   # op_delivery
    - 0.4   # op_inspection
    - 0.3   # op_compute
    - 0.4   # op_communication
    - 0.3   # op_completion
    - 0.2   # op_empty
    - 0.75  # req_mobility
    - 0.85  # req_logistics
    - 0.3   # req_inspection
    - 0.4   # req_communication
    - 0.3   # req_compute
    - 0.85  # payload_weight
    - 0.35  # compute_gflops
    - 0.35  # cpu_intensity
    - 0.35  # memory_intensity
    - 0.45  # io_intensity
    - 0.45  # comm_bandwidth_mb
    - 0.55  # max_latency_s
    - 0.3   # quality_threshold
    - 0.25  # inspection_interval
    - 0.25  # n_inspection_points
    n_clusters_per_run: 25
  notes: 物流场景：空间紧凑时，更多按任务类型聚类
- id: R_inspection_heavy
  priority: 10
  if:
  - feature: task_diversity
    op: <
    value: 0.3
  then:
    weights:
    - 0.7   # location_x
    - 0.7   # location_y
    - 0.7   # location_z
    - 0.4   # op_pickup
    - 0.4   # op_transport
    - 0.4   # op_delivery
    - 0.95  # op_inspection
    - 0.7   # op_compute
    - 0.6   # op_communication
    - 0.4   # op_completion
    - 0.2   # op_empty
    - 0.4   # req_mobility
    - 0.4   # req_logistics
    - 0.95  # req_inspection
    - 0.6   # req_communication
    - 0.7   # req_compute
    - 0.3   # payload_weight
    - 0.9   # compute_gflops
    - 0.8   # cpu_intensity
    - 0.8   # memory_intensity
    - 0.7   # io_intensity
    - 0.7   # comm_bandwidth_mb
    - 0.8   # max_latency_s
    - 0.95  # quality_threshold
    - 0.9   # inspection_interval
    - 0.9   # n_inspection_points
    n_clusters_per_run: 35
  notes: 巡检为主场景：强调巡检任务和质量要求
- id: R_balanced_default
  priority: 0
  default: true
  then:
    weights:
    - 0.75  # location_x
    - 0.75  # location_y
    - 0.7   # location_z
    - 0.8   # op_pickup
    - 0.8   # op_transport
    - 0.8   # op_delivery
    - 0.8   # op_inspection
    - 0.6   # op_compute
    - 0.6   # op_communication
    - 0.6   # op_completion
    - 0.5   # op_empty
    - 0.7   # req_mobility
    - 0.75  # req_logistics
    - 0.75  # req_inspection
    - 0.6   # req_communication
    - 0.6   # req_compute
    - 0.75  # payload_weight
    - 0.65  # compute_gflops
    - 0.65  # cpu_intensity
    - 0.65  # memory_intensity
    - 0.65  # io_intensity
    - 0.6   # comm_bandwidth_mb
    - 0.65  # max_latency_s
    - 0.7   # quality_threshold
    - 0.7   # inspection_interval
    - 0.7   # n_inspection_points
    n_clusters_per_run: 30
  notes: 默认平衡规则，适用于一般场景
